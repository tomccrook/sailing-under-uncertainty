[project]
name = "sailing-research-support"
version = "0.1.0"
description = "Independent measurement, weather and bounded cloud support for Sail Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "pydantic>=2",
  "pyarrow>=19",
  "pyproj>=3.7,<4",
  "gpxpy>=1.6,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "boto3>=1.40,<2",
]

[project.scripts]
sailing-support = "sail_support.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "httpx>=0.28,<1", "types-requests>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sail_support"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
