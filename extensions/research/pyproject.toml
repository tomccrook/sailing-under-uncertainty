[project]
name = "sailing-research-desk"
version = "0.1.0"
description = "Bounded MCP evidence investigation independent of frozen sailing science"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2,<3", "pydantic>=2", "numpy>=2", "httpx>=0.28,<1"]
[project.optional-dependencies]
local = ["mlx-lm>=0.31,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
[project.scripts]
sailing-research = "sail_research.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sail_research"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "huggingface_hub.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
