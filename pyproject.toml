[project]
name = "sailing-under-uncertainty"
version = "0.1.0"
description = "Reproducible partially observed sailing decision research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.16",
    "pyarrow>=19",
    "matplotlib>=3.10",
    "gymnasium>=1.2,<2",
    "torch>=2.8,<3",
    "stable-baselines3>=2.7,<3",
]

[project.scripts]
sail-lab = "sail_lab.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sail_lab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs", "/tests", "/schemas", "/pyproject.toml", "/uv.lock", "/README.md", "/PROJECT_BRIEF.md", "/docs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
